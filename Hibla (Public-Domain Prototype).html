{id:"adios",title:"Mi último adiós",author:"José Rizal",year:"1896",lang:"Spanish",note:"Author died 1896",
 ctx:"Rizal wrote this poem shortly before his execution on December 30, 1896, and left it untitled. His friend Mariano Ponce had it printed in Hong Kong in 1897 as “Mi último pensamiento”; the title “Mi último adiós” came into use later.",
 src:"Spanish text: Biblioteca Virtual Universal, with obvious typos corrected and checked against Wikisource. Punctuation varies between editions; confirm against a trusted edition before citing.",
 st:["¡Adiós, Patria adorada, región del sol querida,/Perla del Mar de Oriente, nuestro perdido Edén!/A darte voy, alegre, la triste, mustia vida;/Y fuera más brillante, más fresca, más florida,/También por ti la diera, la diera por tu bien.",
"En campos de batalla, luchando con delirio,/Otros te dan sus vidas, sin dudas, sin pesar./El sitio nada importa: ciprés, laurel o lirio,/Cadalso o campo abierto, combate o cruel martirio,/Lo mismo es si lo piden la Patria y el hogar.",
"Yo muero, cuando veo que el cielo se colora/Y al fin anuncia el día, tras lóbrego capuz;/Si grana necesitas, para teñir tu aurora,/¡Vierte la sangre mía, derrámala en buen hora,/Y dórela un reflejo de su naciente luz!",
"Mis sueños, cuando apenas muchacho adolescente,/Mis sueños, cuando joven, ya lleno de vigor,/Fueron el verte un día, joya del Mar de Oriente,/Secos los negros ojos, alta la tersa frente,/Sin ceño, sin arrugas, sin manchas de rubor.",
"Ensueño de mi vida, mi ardiente vivo anhelo,/¡Salud! te grita el alma que pronto va a partir;/¡Salud! ¡Ah, que es hermoso caer por darte vuelo,/Morir por darte vida, morir bajo tu cielo,/Y en tu encantada tierra la eternidad dormir!",
"Si sobre mi sepulcro vieres brotar, un día,/Entre la espesa yerba, sencilla humilde flor,/Acércala a tus labios y besa el alma mía,/Y sienta yo en mi frente, bajo la tumba fría,/De tu ternura el soplo, de tu hálito el calor.",
"Deja a la luna verme, con luz tranquila y suave;/Deja que el alba envíe su resplandor fugaz;/Deja gemir al viento, con su murmullo grave;/Y si desciende y posa sobre mi cruz un ave,/Deja que el ave entone su cántico de paz.",
"Deja que el sol, ardiendo, las lluvias evapore/Y al cielo tornen puras, con mi clamor en pos;/Deja que un ser amigo mi fin temprano llore;/Y en las serenas tardes, cuando por mí alguien ore,/Ora también, oh Patria, por mi descanso a Dios.",
"Ora por todos cuantos murieron sin ventura;/Por cuantos padecieron tormentos sin igual;/Por nuestras pobres madres, que gimen su amargura;/Por huérfanos y viudas, por presos en tortura,/Y ora por ti, que veas tu redención final.",
"Y cuando, en noche oscura, se envuelva el cementerio,/Y solos sólo muertos queden velando allí,/No turbes su reposo, no turbes el misterio:/Tal vez acordes oigas de cítara o salterio;/Soy yo, querida Patria, yo que te canto a ti.",
"Y cuando ya mi tumba, de todos olvidada,/No tenga cruz ni piedra que marquen su lugar,/Deja que la are el hombre, la esparza con la azada,/Y mis cenizas, antes que vuelvan a la nada,/En polvo de tu alfombra que vayan a formar.",
"Entonces nada importa me pongas en olvido:/Tu atmósfera, tu espacio, tus valles cruzaré;/Vibrante y limpia nota seré para tu oído:/Aroma, luz, colores, rumor, canto, gemido,/Constante repitiendo la esencia de mi fe.",
"Mi Patria idolatrada, dolor de mis dolores,/Querida Filipinas, oye el postrer adiós./Ahí te dejo todo: mis padres, mis amores./Voy donde no hay esclavos, verdugos ni opresores;/Donde la fe no mata, donde el que reina es Dios.",
"Adiós, padres y hermanos, trozos del alma mía,/Amigos de la infancia en el perdido hogar;/Dad gracias, que descanso del fatigoso día;/Adiós, dulce extranjera, mi amiga, mi alegría;/Adiós, queridos seres. Morir es descansar."],
 par:["Farewell to the beloved homeland. He gives his life gladly, and would give a better one if he had it.","Others die fighting for the homeland. The place and manner of death do not matter if the homeland and home call for it.","He dies as dawn comes. If the homeland needs red for its sunrise, let his blood color it.","His lifelong dream was to see the homeland free of tears, grief, and shame.","He greets the dream of his life. It is beautiful to die so that the homeland may rise and live.","If a humble flower grows on his grave, he asks the homeland to kiss it so he can feel her tenderness.","Let the moon, the dawn, the wind, and a singing bird keep company over his grave.","Let a friend mourn and the homeland pray for his rest.","He asks the homeland to pray for all who suffered (mothers, orphans, widows, prisoners) and for her own redemption.","When night covers the cemetery, the homeland should not disturb the dead. Any music she hears is him singing to her.","When his grave is forgotten, let it be plowed over so his ashes become part of the land.","Forgotten, he will still cross the land as sound, scent, light, and color, repeating his faith.","His last farewell to the Philippines. He goes where there are no slaves, tyrants, or oppressors, and where faith does not kill.","Farewell to family, friends, and loved ones. To die is to rest."],
 parLabel:"Plain-English summary by stanza (study aid, not an official translation)",
 gloss:{"adiós":"goodbye, farewell","patria":"fatherland, homeland","adorada":"beloved, adored","región":"region, land","querida":"dear, beloved","perla":"pearl","mar":"sea","oriente":"the East, the Orient","perdido":"lost","edén":"Eden, paradise","alegre":"gladly, cheerfully","mustia":"withered, faded","diera":"would give","bien":"good, welfare","delirio":"frenzy","pesar":"grief, regret","ciprés":"cypress","lirio":"lily","cadalso":"scaffold, gallows","martirio":"martyrdom","colora":"turns colored, reddens","lóbrego":"gloomy, dark","capuz":"hood, cloak (of night)","grana":"crimson","aurora":"dawn","derrámala":"pour it out","dórela":"let it gild","naciente":"rising, new-born","sueños":"dreams","joya":"jewel","tersa":"smooth","ceño":"frown","rubor":"blush, shame","ensueño":"dream, vision","anhelo":"longing","salud":"hail, greetings (also “health”)","sepulcro":"tomb","vieres":"you see (archaic)","yerba":"grass","humilde":"humble","ternura":"tenderness","hálito":"breath","soplo":"breath, puff","alba":"dawn","resplandor":"glow","fugaz":"fleeting","gemir":"to moan","murmullo":"murmur","grave":"deep, solemn","cruz":"cross","ave":"bird","entone":"sing out","cántico":"song, hymn","evapore":"evaporate","clamor":"outcry, plea","ore":"pray (subjunctive)","ora":"pray","redención":"redemption","huérfanos":"orphans","viudas":"widows","presos":"prisoners","ventura":"fortune, luck","cementerio":"cemetery","cítara":"zither","salterio":"psaltery (stringed instrument)","azada":"hoe, spade","cenizas":"ashes","alfombra":"carpet","olvido":"oblivion, forgetting","olvidada":"forgotten","aroma":"scent","gemido":"moan, groan","esclavos":"slaves","verdugos":"executioners","opresores":"oppressors","idolatrada":"adored","postrer":"last, final","extranjera":"foreign woman","fatigoso":"tiring","morir":"to die","descansar":"to rest","descanso":"rest, I rest"},
 qa:[{q:"Who is the speaker addressing?",a:"The homeland itself, called “Patria adorada” and “región del sol querida”.",c:[0]},
 {q:"What does “Perla del Mar de Oriente” mean?",a:"“Pearl of the Orient Sea”, a phrase for the Philippines. “Nuestro perdido Edén” (our lost Eden) adds a sense of loss.",c:[1]},
 {q:"What is the speaker willing to give?",a:"His life. He offers it gladly, and says he would give it even if it were brighter and fresher.",c:[2,3,4]},
 {q:"What does he ask of the homeland after his death?",a:"To pray for his rest, and also to pray for everyone who suffered.",c:[39,40]},
 {q:"Where does he say he is going?",a:"To a place with no slaves, executioners, or oppressors, where faith does not kill and God reigns.",c:[63,64]}]},
{id:"pagibig",title:"Pag-ibig sa Tinubuang Lupa",author:"Andrés Bonifacio",year:"1896",lang:"Tagalog",note:"Author died 1897",
 ctx:"Published in the first issue of Kalayaan, the Katipunan’s newspaper, in March 1896 under Bonifacio’s pen name Agapito Bagumbayan (A.I.B.). It has 28 stanzas of 12-syllable lines and urges Filipinos to defend and love the homeland.",
 src:"Tagalog text: transcription from the Gat Andres Bonifacio blog (G. V. Bituin Jr.). Spelling and punctuation vary between editions; confirm against the Kalayaan printing or a trusted edition before citing.",
 st:["Aling pag-ibig pa ang hihigit kaya/Sa pagkadalisay at pagkadakila/Gaya ng pag-ibig sa tinub'ang lupa?/Aling pag-ibig pa? Wala na nga, wala.",
"Ulit-ulitin mang basahin ng isip/At isa-isahing talastasing pilit/Ang salita't buhay na limbag at titik/Ng sangkatauhan ito'y namamasid.",
"Banal na Pag-ibig! Pag ikaw ang nukal/Sa tapat na puso ng sino't alinman,/Imbi't taong-gubat, maralita't mangmang,/Nagiging dakila at iginagalang.",
"Pagpupuring lubos ang palaging hangad/Sa bayan ng taong may dangal na ingat;/Umawit, tumula, kumatha't sumulat,/Kalakhan din niya'y isinisiwalat.",
"Walang mahalagang hindi inihandog/Ng may pusong mahal sa Bayang nagkupkop:/Dugo, yaman, dunong, katiisa't pagod,/Buhay ma'y abuting magkalagot-lagot.",
"Bakit? Alin ito na sakdal nang laki/Na hinahandugan ng buong pagkasi?/Na sa lalong mahal nakapangyayari/At ginugugulan ng buhay na iwi?",
"Ay! Ito'y ang Inang Bayang tinubuan,/Siya'y ina't tangi na kinamulatan/Ng kawili-wiling liwanag ng araw/Na nagbigay-init sa lunong katawan.",
"Sa kaniya'y utang ang unang pagtanggap/Ng simoy ng hanging nagbibigay-lunas/Sa inis na puso na sisinghap-singhap/Sa balong malalim ng siphayo't hirap.",
"Kalakip din nito'y pag-ibig sa Bayan/Ang lahat ng lalong sa gunita'y mahal/Mula sa masaya't gasong kasanggulan/Hanggang sa katawa'y mapasalibingan.",
"Ang nangakaraang panahon ng aliw,/Ang inaasahang araw na darating/Ng pagkatimawa ng mga alipin,/Liban pa sa Bayan saan tatanghalin?",
"At ang balang kahoy at ang balang sanga/Ng parang n'ya't gubat na kaaya-aya,/Sukat ang makita't sasaalaala/Ang ina't ang giliw, lumipas na saya.",
"Tubig n'yang malinaw na anaki'y bubog,/Bukal sa batisang nagkalat sa bundok,/Malambot na huni ng matuling agos,/Na nakaaaliw sa pusong may lungkot.",
"Sa aba ng abang mawalay sa Bayan!/Gunita ma'y laging sakbibi ng lumbay,/Walang alaala't inaasam-asam/Kundi ang makita'y lupang tinubuan.",
"Pati ng magdusa't sampung kamatayan/Wari ay masarap kung dahil sa Bayan/At lalong maghirap, O! himalang bagay,/Lalong pag-irog pa ang sa kanya'y alay.",
"Kung ang Bayang ito'y nasasapanganib/At siya ay dapat na ipagtangkilik,/Ang anak, asawa, magulang, kapatid/Isang tawag niya'y tatalikdang pilit.",
"Dapwat kung ang bayan ng Katagalugan/Ay nilapastangan at niyuyurakan/Katuwiran, puri niya't kamahalan/Ng sama ng lilong taga-ibang bayan.",
"Di gaano kaya ang paghihinagpis/Ng pusong Tagalog sa puring nilait?/Aling kalooban na lalong tahimik/Ang di pupukawin sa paghihimagsik?",
"Saan magbubuhat ang paghinay-hinay/Sa paghihiganti't gumugol ng buhay/Kung wala ding iba na kasasadlakan/Kundi ang lugami sa kaalipinan?",
"Kung ang pagkabaon n'ya't pagkabusabos/Sa lusak ng saya't tunay na pag-ayop,/Supil ng panghampas, tanikalang gapos/At luha na lamang ang pinaaagos?",
"Sa kaniyang anyo'y sino ang tutunghay/Na di aakayin sa gawang magdamdam?/Pusong naglilipak sa pagkasukaban/Ang hindi gumugol ng dugo at buhay.",
"Mangyayari kaya na ito'y masulyap/Ng mga Tagalog at hindi lumingap/Sa naghihingalong Inang nasa yapak/Na kasuklam-suklam sa Kastilang hamak?",
"Nasaan ang dangal ng mga Tagalog?/Nasaan ang dugong dapat na ibuhos?/Baya'y inaapi, bakit di kumilos/At natitilihang ito'y mapanuod?",
"Hayo na nga kayo, kayong nangabuhay/Sa pag-asang lubos na kaginhawahan/At walang tinamo kundi kapaitan/Hayo na't ibigin ang naabang Bayan.",
"Kayong natuy'an na sa kapapasakit/Ng dakilang hangad sa batis ng dibdib,/Muling pabalungi't tunay na pag-ibig/Kusang ibulalas sa Bayang piniit.",
"Kayong nalagasan ng bunga't bulaklak,/Kahoy nyaring buhay na nilanta't sukat/Ng bala-balaki't makapal na hirap,/Muling manariwa't sa Baya'y lumiyag.",
"Kayong mga pusong kusang napapagal/Ng daya at bagsik ng ganid na asal,/Ngayon ay magbango’t Bayan ay itanghal/Agawin sa kuko ng mga sukaban.",
"Kayong mga dukhang walang tanging lasap/Kundi ang mabuhay sa dalita’t hirap,/Ampunin ang Bayan kung nasa ay lunas/Pagkat ang ginhawa niya ay sa lahat.",
"Ipaghandog-handog ang buong pag-ibig,/At hanggang may dugo’y ubusang itigis/Kung sa pagtatanggol, buhay ay mapatid/Ito’y kapalaran at tunay na langit."],
 par:["What love could be purer and greater than love for the native land? None.","However often the mind reviews human writings and lives, this is what it finds.","Holy love: whoever feels it sincerely, even the lowly, poor, or unschooled, becomes great and respected.","A person of honor always seeks to praise the country, and sings and writes about its greatness.","Anyone who loves the country that sheltered them withholds nothing: blood, wealth, knowledge, patience, toil, even life.","Why? What is so great that it receives such total devotion and is worth a whole life?","It is the Motherland, our mother, from whom we first saw the warm light of the sun.","To her we owe the first breath of healing air, easing the heart in a well of sorrow and hardship.","With love of country come all the dearest memories, from happy infancy to the grave.","Past joys and the hoped-for day when slaves are freed: where else could they be celebrated but in the homeland?","Every tree and branch in her fields and forests recalls mother, beloved, and vanished happiness.","Her clear water, mountain springs, and gentle streams comfort a sorrowing heart.","Pity the one separated from the homeland: memory brings only sorrow and he longs to see his native land.","Even suffering and a thousand deaths seem sweet for her sake, and hardship only deepens love.","If the country is in danger, one will leave child, spouse, parents, and siblings at her call.","But if the Tagalog land is violated and its honor trampled by treacherous foreigners...","How great is the grief of the Tagalog heart over insulted honor? What calm spirit would not be roused to revolt?","Why hold back from vengeance and sacrifice when the only alternative is sinking into slavery?","Her country buried and enslaved, whipped and chained, with only tears left to shed...","Who could see her state without being moved to anger? Only a lowly heart would refuse to give blood and life.","Can Tagalogs see their dying mother under the feet of contemptible Spaniards and not come to her aid?","Where is the honor of the Tagalogs? Where is the blood to be shed? Why do they watch the oppression and not act?","To you who lived hoping for comfort and got only bitterness: come, love the afflicted country.","To you worn by suffering for a noble aim: let true love burst out for the imprisoned country.","To you whose fruit and flowers are stripped and whose lives are withered by hardship: bloom again and love the country.","To you wearied by deceit and cruelty: rise, lift up the country, and snatch her from the claws of the villains.","To you poor, who know only misery: take in the country as your cure, for her comfort is for everyone.","Give all your love, spend your blood to the last drop. If life is lost defending her, that is fortune and true heaven."],

TEXTS.push({"id": "juventud", "title": "A la juventud filipina", "author": "José Rizal", "year": "1879", "lang": "Spanish", "note": "Author died 1896", "ctx": "Rizal wrote this poem at eighteen, while a student at the University of Santo Tomás. It won a poetry contest of the Liceo Artístico-Literario of Manila in 1879, open to native-born Filipinos.", "src": "Spanish text and context: JoseRizal.com, checked against the Wikisource text it cites. Punctuation varies between editions; confirm against a trusted edition before citing.", "st": ["¡Alza su tersa frente,/Juventud Filipina, en este día!/¡Luce resplandeciente/Tu rica gallardía,/Bella esperanza de la patria mía!", "Vuela, genio grandioso,/Y les infunde noble pensamiento,/Que lance vigoroso,/Más rápido que el viento,/Su mente virgen al glorioso asiento.", "Baja con la luz grata/De las artes y ciencias a la arena,/Juventud, y desata/La pesada cadena/Que tu genio poético encadena.", "Ve que en la ardiente zona/Do moraron las sombras, el hispano/Esplendente corona,/Con pía sabia mano,/Ofrece al hijo de este suelo indiano.", "Tú, que buscando subes,/En alas de tu rica fantasía,/Del Olimpo en las nubes/Tiernísima poesía/Más sabrosa que néctar y ambrosía.", "Tú, de celeste acento,/Melodioso rival Filomena,/Que en variado concento/En la noche serena/Disipas del mortal la amarga pena.", "Tú que la peña dura/Animas al impulso de tu mente,/Y la memoria pura/Del genio refulgente/Eternizas con genio prepotente.", "Y tú, que el vario encanto/De Febo, amado del divino Apeles,/Y de natura el manto/Con mágicos pinceles/Trasladar al sencillo lienzo sueles.", "¡Corred! que sacra llama/Del genio el lauro coronar espera,/Esparciendo la fama/Con trompa pregonera/El nombre del mortal por la ancha esfera.", "¡Día, día felice,/Filipinas gentil, para tu suelo!/¡Al Potente bendice/Que con amante anhelo/La ventura te envía y el consuelo!"], "par": ["Raise your brow, Filipino youth. Let your grace shine, fair hope of the homeland.", "Genius, fly down and fill the young with noble thought that rises swiftly to glory.", "Youth, come down with the light of the arts and sciences and untie the chain that binds your poetic genius.", "In the burning zone where shadows once lived, the Spaniard offers a resplendent crown to the native son.", "To the poet, who rises on imagination to Olympus for poetry sweeter than nectar.", "To the singer, rival of the nightingale, whose night song eases mortal pain.", "To the sculptor, who brings hard stone to life and makes a genius’s memory eternal.", "To the painter, who carries nature’s mantle onto the simple canvas with magic brushes.", "Run! The sacred flame of genius waits to crown you with laurel and spread your name across the world.", "A happy day for the Philippines. Give thanks to the Almighty who sends fortune and consolation."], "parLabel": "Plain-English summary by stanza (study aid, not an official translation)", "gloss": {"alza": "raise", "tersa": "smooth", "frente": "brow, forehead", "juventud": "youth", "resplandeciente": "shining", "gallardía": "grace, gallantry", "esperanza": "hope", "genio": "genius, creative spirit", "grandioso": "grand", "infunde": "instills", "vigoroso": "vigorous", "virgen": "pure, untouched", "asiento": "seat, place", "grata": "pleasing", "artes": "arts", "arena": "arena, field of contest", "desata": "untie", "cadena": "chain", "encadena": "binds", "ardiente": "burning", "zona": "zone, region", "moraron": "dwelled", "sombras": "shadows", "hispano": "Spaniard", "esplendente": "resplendent", "corona": "crown", "pía": "pious", "sabia": "wise", "indiano": "of the Indies, native", "olimpo": "Mount Olympus", "fantasía": "imagination", "tiernísima": "most tender", "néctar": "nectar", "ambrosía": "ambrosia (food of the gods)", "celeste": "heavenly", "acento": "voice, accent", "melodioso": "melodious", "filomena": "Philomela, the nightingale of myth", "concento": "harmony", "disipas": "dispel", "pena": "sorrow", "peña": "rock", "impulso": "impulse", "refulgente": "shining", "eternizas": "make eternal", "prepotente": "mighty", "encanto": "charm", "febo": "Phoebus (Apollo)", "apeles": "Apelles, famed painter of ancient Greece", "natura": "nature", "manto": "mantle, cloak", "pinceles": "brushes", "lienzo": "canvas", "corred": "run", "sacra": "sacred", "llama": "flame", "lauro": "laurel", "fama": "fame", "trompa": "trumpet", "pregonera": "proclaiming", "esfera": "sphere, world", "felice": "happy", "gentil": "gracious", "potente": "the Almighty", "bendice": "bless", "anhelo": "longing", "ventura": "fortune", "consuelo": "consolation"}, "qa": [{"q": "What does the poem command the youth to do first?", "a": "To raise their brow and let their grace shine, calling them “bella esperanza de la patria mía”, the fair hope of my homeland.", "c": [0, 4]}, {"q": "How does stanza 4 describe Spain?", "a": "As offering a resplendent crown, with “pía sabia mano” (pious, wise hand), to the native son. How to read this is a question for the Postcolonial lens.", "c": [16, 17, 18, 19]}, {"q": "How does the poem end?", "a": "With a blessing on a “happy day” for the Philippines and thanks to the Almighty who sends fortune and consolation.", "c": [45, 49]}]},{"id": "bayanko", "title": "Bayan Ko", "author": "José Corazón de Jesús", "year": "1929", "lang": "Tagalog", "note": "Author died 1932", "ctx": "The Tagalog lyrics date from 1929 and are attributed to José Corazón de Jesús, adapted from an earlier Spanish poem attributed to José Alejandrino. Only the words are included here; the melody is a separate work.", "src": "Tagalog text: transcriptions on Wikisource, Wikipedia and other sites. Spellings and accent marks vary between printings; confirm against de Jesús’s published collection before citing.", "st": ["Ang bayan kong Pilipinas,/lupain ng ginto’t bulaklak./Pag-ibig ang sa kaniyáng palad,/nag-alay ng ganda’t dilág./At sa kaniyáng yumi at ganda,/dayuhan ay nahalina./Bayan ko, binihag ka,/nasadlak sa dusa.", "Ibon mang may layang lumipad,/kulungin mo at umiiyak!/Bayan pa kayáng sakdal-dilag,/ang di magnasang makaalpas!/Pilipinas kong minumutya,/pugad ng luhá ko’t dalita,/aking adhika:/makita kang sakdal laya!"], "par": ["The Philippines, land of gold and flowers, was given beauty by love, and a foreigner was enchanted by it. Now the homeland is a captive and in suffering.", "Even a free bird cries when caged, so how could a beautiful homeland not long to escape? The speaker’s wish is to see the homeland completely free."], "parLabel": "Plain-English summary by stanza (study aid, not an official translation)", "gloss": {"bayan": "town, country, people", "lupain": "land", "ginto’t": "gold and", "bulaklak": "flower(s)", "pag-ibig": "love", "palad": "fate, palm of the hand", "kaniyáng": "her", "nag-alay": "offered", "dilág": "beauty, splendor", "yumi": "grace, refinement", "dayuhan": "foreigner", "nahalina": "was enchanted", "binihag": "taken captive", "nasadlak": "fell into", "dusa": "suffering", "ibon": "bird", "layang": "free", "lumipad": "to fly", "kulungin": "to cage", "umiiyak": "cries", "sakdal-dilag": "utterly beautiful", "magnasang": "to wish for", "makaalpas": "to break free, escape", "minumutya": "cherished like a pearl", "pugad": "nest", "luhá": "tears", "dalita": "misery", "adhika": "aim, aspiration", "sakdal": "complete, utter", "laya": "freedom"}, "qa": [{"q": "Who is the “dayuhan”?", "a": "A foreigner, left unnamed, who is drawn to the homeland’s beauty. The poem then says the homeland was taken captive.", "c": [4, 5, 6]}, {"q": "Which image shows captivity?", "a": "A bird that cries when caged: “Ibon mang may layang lumipad, kulungin mo at umiiyak.”", "c": [8, 9]}, {"q": "What does the speaker wish for?", "a": "To see the homeland “sakdal laya”, completely free.", "c": [14, 15]}]});

var FOCUS={"adios": {"formal": {"q": ["Stanzas 7–8 begin repeatedly with “Deja”, and stanzas 8–9 with “Ora”. How does this repetition shape the speaker’s tone?", "Compare the images of dawn and light (stanza 3) with night (stanza 10). What pattern do you notice?"], "st": [3, 7, 8, 10]}, "hist": {"q": ["The poem was written shortly before Rizal’s execution in December 1896. How does that occasion change a line like “morir por darte vida”?", "Stanza 13 names “esclavos, verdugos, opresores”. What colonial conditions might these words point to?"], "st": [5, 13]}, "post": {"q": ["Who is the “Patria” to the speaker, and how does the poem imagine the homeland apart from colonial rule?", "The poem is written in Spanish, the colonizer’s language. What does it mean to claim the homeland in that language?"], "st": [1, 13]}, "marx": {"q": ["Stanza 9 names mothers, orphans, widows, and prisoners. What does this suggest about who bears the cost of colonial rule?", "Whose life is offered in the poem, and who is imagined to benefit from the sacrifice?"], "st": [2, 9]}, "fem": {"q": ["The homeland is addressed as “Patria adorada” and “querida Filipinas”, a feminine figure. Is she beloved, mother, listener, or something else?", "Stanza 14 bids farewell to “dulce extranjera”. How are women positioned in the farewell?"], "st": [1, 6, 14]}, "reader": {"q": ["Knowing the poem is a farewell before an execution, how do you read the gentle images in stanzas 6 and 7?", "In stanza 10 the speaker says the music you hear is him. Who is the “you” the poem imagines reading it?"], "st": [6, 7, 10]}}, "pagibig": {"formal": {"q": ["Questions open and recur in stanzas 1, 6, 17, and 22. What effect does the poem gain from asking instead of stating?", "Trace the movement from praise (1–15) to accusation (16–22) to a call to act (23–28). What changes in tone?"], "st": [1, 6, 17, 22]}, "hist": {"q": ["The poem appeared in Kalayaan in March 1896, months before the revolution began. How might Katipunan readers have used it?", "What grievances are named in stanzas 16–21, and what do they say about the colonial situation?"], "st": [16, 21]}, "post": {"q": ["How does the poem build the nation out of land, memory, and mother imagery in stanzas 7–12?", "Stanza 21 names “Kastilang hamak”. How does the poem place colonizer and colonized?"], "st": [7, 16, 21]}, "marx": {"q": ["Stanza 3 says love of country lifts the poor and unschooled, and stanza 27 addresses the poor directly. How does class figure in the call?", "Stanza 5 asks for blood, wealth, knowledge, and toil. What does it mean to claim labor and property for the nation?"], "st": [3, 5, 27]}, "fem": {"q": ["The homeland is “Ina” in stanzas 7 and 21. What does the mother image ask of its children, and who is imagined as the one who acts?", "Stanza 15 lists child, spouse, parents, and siblings to be left behind. Whose domestic roles are set aside, and for whom?"], "st": [7, 15, 21]}, "reader": {"q": ["Stanzas 23–27 begin with “Kayong…” (you all). Which reader do you feel addressed as, and do you answer the call?", "Which feelings does the poem build in stanzas 17–22, and where do you agree or resist?"], "st": [17, 23, 27]}}, "juventud": {"formal": {"q": ["The poem moves by commands (“¡Alza!”, “Vuela”, “Baja”, “¡Corred!”). How do these build momentum?", "Trace the classical allusions (Olimpo, Filomena, Febo, Apeles). What tone do they create?"], "st": [1, 5, 6, 8, 9]}, "hist": {"q": ["The poem won a contest open to native-born Filipinos in 1879. Why might that setting matter to how it is written?", "Compare stanza 4 with “Mi último adiós” (1896). How might Rizal’s view of the homeland have changed?"], "st": [4]}, "post": {"q": ["Stanza 4 presents Spain as bringing a crown to “el hijo de este suelo indiano”. Do you read it as sincere, strategic, or ironic?", "“Patria mía” (stanza 1) and “Filipinas” (stanza 10): what nation is imagined, and for whom?"], "st": [1, 4, 10]}, "marx": {"q": ["Poets, musicians, sculptors, and painters are celebrated. Which kinds of labor and talent are not named?", "Who would have had access to the education that makes this “genio” possible?"], "st": [5, 6, 7, 8]}, "fem": {"q": ["Philomel is a mythic woman associated with song (stanza 6). What does the poem do with her image?", "Stanza 4 says “hijo” (son). Who counts as the “youth” the poem addresses?"], "st": [4, 6]}, "reader": {"q": ["The poem commands the youth to “run”. How does the imperative address you as a young reader today?", "Does knowing Rizal was eighteen change how you read the poem’s confidence?"], "st": [1, 9, 10]}}, "bayanko": {"formal": {"q": ["How does the caged bird image in stanza 2 make the homeland’s captivity something readers can feel?", "How do the short final lines (“aking adhika: makita kang sakdal laya!”) shape the ending?"], "st": [2]}, "hist": {"q": ["Who might “dayuhan” point to in the American period, and why might the poet leave them unnamed?", "The poem later became a protest song. How does a later use change what the lines mean?"], "st": [1]}, "post": {"q": ["How is the homeland described before and after the “dayuhan” arrives?", "The speaker wants “sakdal laya”. What kind of freedom does the poem imagine?"], "st": [1, 2]}, "marx": {"q": ["What is the relationship between the land’s wealth (“ginto’t bulaklak”) and its captivity?", "Who suffers (“luha”, “dalita”), and whose voice speaks “aking adhika”?"], "st": [1, 2]}, "fem": {"q": ["The homeland is “sakdal-dilag” and “binihag”. What does it mean to picture a captive, beautiful figure with feminine associations?", "In this image, who rescues and who is rescued?"], "st": [1, 2]}, "reader": {"q": ["The poem speaks directly to “bayan ko”. How does direct address change your reading, especially if you know it as a song?", "Which line stays with you most, and why?"], "st": [1, 2]}}};

Object.assign(LENS,{"structural": {"n": "Structuralism", "ask": "How does the text work as a system of signs, patterns, and oppositions that produce meaning?", "terms": "binary oppositions · sign and signified · structure · system", "gen": "What binary oppositions organize this text, and how does it resolve or leave them open?"}, "poststruct": {"n": "Post-structuralism", "ask": "Where does meaning slip, contradict itself, or depend on what the text leaves out?", "terms": "deconstruction · instability · what is excluded · multiple meanings", "gen": "Where does the text’s meaning slip, contradict itself, or depend on what it leaves out?"}, "modern": {"n": "Modernism", "ask": "How does the text deal with fragmentation, ambiguity, experiment with form, and a break from older traditions?", "terms": "fragmentation · ambiguity · experiment · alienation", "gen": "Does the text show fragmentation or experiment with form, or does it hold to an older order?"}, "romantic": {"n": "Romanticism", "ask": "How do emotion, imagination, nature, the individual, and the spirit of a people shape the text?", "terms": "emotion · imagination · nature · the sublime · nationalism", "gen": "How do emotion, imagination, nature, and the spirit of the nation shape the text?"}, "realism": {"n": "Realism", "ask": "What everyday conditions and concrete social details does the text show, and how faithful or idealized are they?", "terms": "social detail · everyday life · class · cause and effect", "gen": "What concrete social details does the text show, and how faithful or idealized are they?"}, "eco": {"n": "Ecocriticism", "ask": "How is nature presented, and what relation between people and the land or living world does the text imagine?", "terms": "nature · place · land · human and nonhuman", "gen": "How is nature presented, and what relation between people and the land does the text imagine?"}, "postmodern": {"n": "Postmodernism", "ask": "How does the text play with layered versions, irony, borrowing, and distrust of grand narratives?", "terms": "pastiche · irony · layered versions · distrust of grand narratives", "gen": "How does the text play with layered versions, doubt, or distrust of grand narratives?"}, "cultural": {"n": "Culturalism", "ask": "What does the text show about the practices, values, and uses of a culture, including how it travels beyond the page?", "terms": "culture · practice · circulation · popular and official", "gen": "What cultural practices and values does the text reveal, and how is it used beyond the page?"}, "queer": {"n": "Queer theory", "ask": "What does the text assume about gender, desire, family, and belonging, and whose experience does it leave out?", "terms": "heteronormativity · desire · family · who is left out", "gen": "What does the text assume about gender, desire, family, and belonging, and whose experience is left out?"}, "psych": {"n": "Psychoanalytic", "ask": "What desires, fears, or conflicts, conscious or hidden, drive the speaker or the text?", "terms": "desire · repression · the unconscious · grief", "gen": "What desires, fears, or conflicts, conscious or hidden, drive the speaker or the text?"}, "newhist": {"n": "New Historicism", "ask": "How does the text connect to other texts, institutions, and power relations of its time, treating context as a text too?", "terms": "circulation of texts · power · institutions · context as text", "gen": "How does the text connect to other texts, institutions, and power relations of its time?"}, "archetype": {"n": "Archetypal (myth)", "ask": "Which recurring patterns, figures, and myths does the text draw on?", "terms": "archetype · myth · ritual · hero · mother", "gen": "Which recurring patterns or figures (hero, mother, journey, sacrifice) does the text use?"}, "pantayo": {"n": "Pantayong Pananaw", "ask": "Does the text speak from within a community, in its own language and terms, and who counts as “we” (pantayo)?", "terms": "pantayo (we-group) · sariling wika · bayan · loo var FA={"adios": {"structural": {"q": ["Look for oppositions: life and death, dawn and night, remembered and forgotten, slaves and freedom (stanzas 3, 10, 11, 13). How does the poem arrange or resolve them?"], "st": [3, 10, 11, 13]}, "poststruct": {"q": ["In stanza 12 the speaker says he will live on as scent, light, color, and sound even if forgotten. Can the poem’s meaning stay stable when the speaker is absent and the reader decides?"], "st": [11, 12]}, "modern": {"q": ["Modernism often favors fragmentation and ambiguity. Where does this poem keep to order, rhyme, and direct address instead, and what does the contrast show?"], "st": [1, 14]}, "romantic": {"q": ["How do nature, strong feeling, and sacrifice for the homeland in stanzas 3, 5, and 7 fit Romantic ideals?"], "st": [3, 5, 7]}, "realism": {"q": ["Which details are concrete (the cemetery, the cross, the hoe, prisoners)? What social reality do they suggest?"], "st": [9, 10, 11]}, "eco": {"q": ["What roles do sun, rain, wind, moon, bird, and soil play in stanzas 7, 8, and 11? Is nature a witness, a messenger, or part of the homeland?"], "st": [7, 8, 11]}, "postmodern": {"q": ["Does the poem trust one voice and one meaning? Compare with postmodern suspicion of grand narratives like nation and sacrifice."], "st": [5, 13]}, "cultural": {"q": ["How does the poem draw on practices like prayer, the cross, the cemetery, and mourning (stanzas 7–10)? What do they say about the culture of its readers?"], "st": [7, 8, 9, 10]}, "queer": {"q": ["The poem uses language of devotion and desire for the homeland and bids farewell to “dulce extranjera”. What does it take for granted about love, family, and gender, and who does it leave out?"], "st": [5, 14]}, "psych": {"q": ["What does the speaker want or fear when he imagines his burial and being forgotten (stanzas 6 and 11)? How does the poem handle grief?"], "st": [6, 11]}, "newhist": {"q": ["Read the poem alongside colonial records of Rizal’s trial and execution. How might the poem and the official record shape each other’s meaning?"], "st": [1, 13]}, "archetype": {"q": ["Identify archetypes: the martyr, the mother-land, the journey to a place beyond death (stanza 13). How does the poem use them?"], "st": [1, 13]}, "pantayo": {"q": ["Who is “we” in this poem? It is written in Spanish; how does that complicate a “from us, for us” reading?"], "st": [1, 12]}}, "pagibig": {"structural": {"q": ["Which oppositions organize the poem: love and enslavement, honor and shame, mother and foreigner, speech and action (stanzas 1, 16–22)? How are they arranged?"], "st": [1, 16, 21, 22]}, "poststruct": {"q": ["The poem claims one love is greatest: “wala na nga, wala”. What does the text exclude to make that claim stable?"], "st": [1, 28]}, "modern": {"q": ["Modernism favors fragmentation and ambiguity. How do this poem’s regular, declaring quatrains differ, and what does the contrast show?"], "st": [1, 28]}, "romantic": {"q": ["Stanzas 7–12 link the homeland to mother, memory, trees, and streams. How do nature and feeling support devotion to the nation?"], "st": [7, 11, 12]}, "realism": {"q": ["Which concrete conditions appear in stanzas 19–20 (whips, chains, tears)? What social reality do they point to?"], "st": [19, 20]}, "eco": {"q": ["Stanzas 11–12 name trees, branches, springs, and streams. How is the land presented as the homeland?"], "st": [11, 12]}, "postmodern": {"q": ["Does the poem allow doubt about the nation or the sacrifice it asks for? What would a suspicious reader question?"], "st": [5, 28]}, "cultural": {"q": ["Stanza 8 says we owe our first breath to the homeland (“utang”), and stanza 22 asks about “dangal”. How do debt and honor work as cultural values here?"], "st": [8, 22]}, "queer": {"q": ["The poem treats family bonds (stanza 15) as the usual basis of loyalty, then asks readers to put the nation first. What does it assume about family, love, and who belongs?"], "st": [15, 23]}, "psych": {"q": ["The poem moves from love to outrage to a demand for sacrifice. What emotions drive the speaker, and what does he want from the reader?"], "st": [16, 17, 28]}, "newhist": {"q": ["Read the poem next to other Katipunan writings and colonial records of 1896. How does it work within that web of texts?"], "st": [1, 28]}, "archetype": {"q": ["The homeland is Mother and the people are her children and defenders. How do these archetypes drive the call to action?"], "st": [7, 21, 28]}, "pantayo": {"q": ["The poem addresses Tagalogs by name (stanzas 16–22) and speaks in Tagalog. Who is “we”, and who stands outside that circle?"], "st": [16, 21, 22]}}, "juventud": {"structural": {"q": ["Stanzas 5–8 each address a different artist. What structure of address does the poem build, and what pattern runs from stanza 1 to 10?"], "st": [5, 6, 7, 8]}, "poststruct": {"q": ["The poem praises “genio” as a stable gift. What does it assume about genius, authority, and who may speak?"], "st": [2, 3, 7]}, "modern": {"q": ["Compare the poem’s classical references and regular rhyme with modernist fragmentation. Where does it look backward?"], "st": [5, 6, 8]}, "romantic": {"q": ["Genius, inspiration, imagination (“fantasía”), and fame run through the poem. How Romantic is its celebration of the artist?"], "st": [2, 5, 9]}, "realism": {"q": ["Which details are concrete rather than idealized? What social reality (colonial education, access to art) does the poem leave out?"], "st": [4, 10]}, "eco": {"q": ["Nature appears as “natura el manto” (stanza 8) and the serene night (stanza 6). Is nature a source of art, a subject, or a backdrop?"], "st": [6, 8]}, "postmodern": {"q": ["What does the poem’s mix of Greek myth and praise of Spain suggest about layered, borrowed cultures? Does it trust any single grand story?"], "st": [4, 5, 8]}, "cultural": {"q": ["How does the poem draw on the colonial school and salon culture of Manila in 1879, such as contests and Greek allusions?"], "st": [5, 6, 8, 9]}, "queer": {"q": ["The poem addresses an ideal youth as “hijo” and speaks of genius and glory. Whose bodies, desires, and identities does that ideal imagine, and whose are left out?"], "st": [4, 9]}, "psych": {"q": ["What drive, ambition, or anxiety might sit behind the poem’s urging to rise and win fame (stanzas 9–10)?"], "st": [9, 10]}, "newhist": {"q": ["Read the poem next to the colonial contest, press, and school life of 1879. How does it negotiate praise of Spain and love of the homeland?"], "st": [4, 10]}, "archetype": {"q": ["Identify archetypes: the call to the hero, the muse, the laurel crown (stanzas 2, 5, 9). How does the poem build a quest for the young artist?"], "st": [2, 9]}, "pantayo": {"q": ["Who is addressed as “Juventud Filipina”? In Spanish, and with praise of Spain, does it speak from within the community or to an outside audience?"], "st": [1, 4]}}, "bayanko": {"structural": {"q": ["Find the oppositions: free and caged, beauty and captivity, native and “dayuhan”. How does the poem set them against each other?"], "st": [1, 2]}, "poststruct": {"q": ["What does “bayan” mean here: land, people, or state? How does the meaning slide between them?"], "st": [1, 2]}, "modern": {"q": ["Modernism favors fragmentation; this poem uses short, song-like lines and direct address. How does that form carry its feeling?"], "st": [1, 2]}, "romantic": {"q": ["The beautiful homeland and the longing for freedom echo Romantic nationalism. Which images are idealized?"], "st": [1, 2]}, "realism": {"q": ["Which parts are concrete (“ginto”, “bulaklak”, “binihag”) and which symbolic? What historical reality does the symbol stand for?"], "st": [1]}, "eco": {"q": ["“Lupain ng ginto’t bulaklak” and the bird image tie land and animal life to freedom. What does the poem suggest about nature and captivity?"], "st": [1, 2]}, "postmodern": {"q": ["Bayan Ko exists as a poem, an adaptation of a Spanish original, and a song. How do the layered versions affect any single “original” meaning?"], "st": [1, 2]}, "cultural": {"q": ["How has this text been used in rallies and songs? What does it mean as a shared cultural object, beyond the page?"], "st": [1, 2]}, "queer": {"q": ["The homeland is pictured as a captive, beautiful, passive figure. What assumptions about gender, protection, and desire sit inside that picture?"], "st": [1, 2]}, "psych": {"q": ["The speaker moves from admiration to grief to longing (“luha”, “dalita”, “adhika”). How do these feelings drive the ending?"], "st": [1, 2]}, "newhist": {"q": ["Read the poem with American-period censorship and nationalist writing of the 1920s. How does it speak around what it cannot name?"], "st": [1]}, "archetype": {"q": ["Identify archetypes: the beautiful captive, the caged bird, the longed-for freedom. What older stories do they echo?"], "st": [1, 2]}, "pantayo": {"q": ["The poem is in Tagalog and speaks as “bayan ko”. Who is the “ko”, and does “we” include everyone in the archipelago?"], "st": [1, 2]}}};

var S={tab:"lib",cur:null,lens:"formal",lang:"All",q:"",en:false,hl:[],openNote:-1,tip:"",ask:null,notes:{},ln:{}};
try{var r1=localStorage.getItem("hibla-notes");if(r1)S.notes=JSON.parse(r1);var r2=localStorage.getItem("hibla-lens");if(r2)S.ln=JSON.parse(r2)}catch(e){}
function save(){try{localStorage.setItem("hibla-notes",JSON.stringify(S.notes));localStorage.setItem("hibla-lens",JSON.stringify(S.ln))}catch(e){}}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function clean(w){return w.replace(/[¡!¿?,.;:"“”()]/g,"").toLowerCase()}
function flat(t){var a=[];t.st.forEach(function(s,i){S5(s).forEach(function(L){a.push({L:L,si:i})})});return a}
function stIdx(t,nums){var o=[];flat(t).forEach(function(x,i){if(nums.indexOf(x.si+1)>-1)o.push(i)});return o}
function badge(t){return '<span class="badge">'+t+'</span>'}
function doy(){var d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)}
function render(){
 var a=document.getElementById("app"),h="";
 if(S.tab==="lib")h=libView();else if(S.tab==="read")h=readView();else h=suriView();
 a.innerHTML=h;
 if(S.tab==="lib")renderList();
 var T=[["lib","Aklatan"],["read","Basahan"],["suri","Suri"]];
 document.getElementById("tabs").innerHTML=T.map(function(x){return '<button class="'+(S.tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><i></i>'+x[1]+'</button>'}).join("");
}
function go(t){S.tab=t;S.tip="";S.openNote=-1;render();window.scrollTo(0,0)}
function head(title,sub){return '<div class="top"><h1 class="serif">'+title+'</h1><button class="btn alt" onclick="toggleTheme()">Theme</button></div><p class="sub">'+sub+'</p><div class="bar"></div>'}
function libView(){
 var th=THREADS[doy()%THREADS.length],t=TEXTS[th.t],ln=flat(t)[th.l].L;
 var h=head("Hibla","Reading Philippine literature, thread by thread");
 h+='<div class="today" onclick="openText('+th.t+')" style="cursor:pointer"><div class="k">TODAY’S THREAD</div><div class="v">'+ln+'</div><div class="m">'+t.author+' · '+t.title+', line '+(th.l+1)+'</div><div class="p">'+th.p+'</div></div>';
 h+='<div class="rule"><b>Public domain only.</b> Every work in this library has an expired copyright, and the complete text is shown so readers can read first and analyze after.</div>';
 h+='<input class="search" id="q" placeholder="Search title, author, or language" value="'+esc(S.q)+'" oninput="S.q=this.value;renderList()">';
 h+='<div class="row">'+["All","Spanish","Tagalog"].map(function(l){return '<button class="chip'+(S.lang===l?' on':'')+'" onclick="S.lang=\''+l+'\';render()">'+l+'</button>'}).join("")+'</div>';
 h+='<div id="list"></div>';
 h+='<h2 class="serif">Coming next</h2><div class="soon">Planned public-domain candidates. Each needs a rights check and a verified text before it is added:<br>'+SOON.join(" · ")+'</div>';
 h+='<p class="small">Prototype: '+TEXTS.length+' complete poems. The study companion uses scripted answers tied to the text, not a live AI.</p>';
 return h;
}
function renderList(){
 var q=S.q.toLowerCase(),h="",n=0;
 TEXTS.forEach(function(t,i){
  if(S.lang!=="All"&&t.lang!==S.lang)return;
  if(q&&(t.title+" "+t.author+" "+t.lang).toLowerCase().indexOf(q)<0)return;
  n++;h+='<div class="card" onclick="openText('+i+')"><h2 class="serif">'+t.title+'</h2><div class="meta">'+t.author+' · '+t.year+' · '+t.lang+' · '+t.st.length+' stanza'+(t.st.length>1?'s':'')+'</div>'+badge("Public domain · "+t.note)+'</div>'});
 if(!n)h='<p class="small">No matching texts.</p>';
 document.getElementById("list").innerHTML=h;
}
function readView(){
 if(S.cur===null)return head("Basahan","Reader")+'<div class="soon">Choose a text in Aklatan to start reading.</div>';
 var t=TEXTS[S.cur],n=0,h=head("Basahan","Reader");
 h+='<h2 class="serif" style="margin-top:4px;font-size:24px">'+t.title+'</h2><p class="sub">'+t.author+' · '+t.year+' · '+t.lang+'</p>'+badge("Public domain · "+t.note);
 h+='<div class="ctx"><b>Context.</b> '+t.ctx+'</div>';
 h+='<div class="row"><button class="chip'+(S.en?' on':'')+'" onclick="S.en=!S.en;render()">Plain-English summary '+(S.en?'on':'off')+'</button><button class="chip" onclick="go(\'suri\')">Analyze this text</button></div>';
 if(S.hl.length)h+='<div class="small">Highlighted lines are focus passages. <a href="#" onclick="S.hl=[];render();return false" style="color:var(--terra)">Clear highlights</a></div>';
 if(S.en)h+='<div class="small">'+t.parLabel+'</div>';
 t.st.forEach(function(st,si){
  h+='<div class="stz">STANZA '+(si+1)+'</div>';
  S5(st).forEach(function(L){
   var i=n++;
   var w=L.split(" ").map(function(x){var k=clean(x);return t.gloss[k]?'<span class="g" onclick="gl(\''+k.replace(/\'/g,"\\'")+'\')">'+x+'</span>':x}).join(" ");
   h+='<div class="ln'+(S.hl.indexOf(i)>-1?' on':'')+'" id="l'+i+'"><button class="num" title="Add a note" onclick="S.openNote=(S.openNote==='+i+'?-1:'+i+');render()">'+(i+1)+'</button><div class="txt">'+w+'</div></div>';
   var key=t.id+":"+i;
   if(S.notes[key])h+='<div class="saved">📝 '+esc(S.notes[key])+'</div>';
   if(S.openNote===i)h+='<div class="note"><textarea id="nt" rows="2" placeholder="Your note on line '+(i+1)+'">'+esc(S.notes[key]||"")+'</textarea><div class="row"><button class="btn" onclick="saveNote('+i+')">Save note</button></div></div>';
  });
  if(S.en)h+='<div class="par">'+t.par[si]+'</div>';
 });
 h+='<div class="srcn">'+t.src+'</div>';
 if(S.tip)h+='<div class="tip" onclick="S.tip=\'\';render()">'+S.tip+'<div class="small" style="color:inherit;opacity:.7">Tap to close</div></div>';
 return h;
}
function suriView(){
 var h=head("Suri","Analysis studio");
 if(S.cur===null){h+='<div class="soon">Choose a text to analyze.</div><div style="margin-top:12px" id="list">';TEXTS.forEach(function(t,i){h+='<div class="card" onclick="S.cur='+i+';render()"><h2 class="serif">'+t.title+'</h2><div class="meta">'+t.author+' · '+t.lang+'</div></div>'});return h+'</div>'}
 var t=TEXTS[S.cur],L=LENS[S.lens],F=FOCUS[t.id][S.lens];
 h+='<p class="sub">Analyzing <b>'+t.title+'</b> · <a href="#" onclick="S.cur=null;S.ask=null;render();return false" style="color:var(--terra)">change text</a></p>';
 h+='<h3>Choose a theory ('+Object.keys(LENS).length+')</h3>'+GROUPS.map(function(g){return '<div class="small" style="margin-top:8px">'+g[0].toUpperCase()+'</div><div class="row" style="margin:4px 0">'+g[1].map(function(k){return '<button class="chip'+(S.lens===k?' on':'')+'" onclick="S.lens=\''+k+'\';render()">'+LENS[k].n+'</button>'}).join("")+'</div>'}).join("");
 h+='<div class="lens"><b>'+L.n+' lens</b><div style="font-size:15px;margin-top:4px">'+L.ask+'</div><div class="small" style="margin-top:6px">Key terms: '+L.terms+'</div><div class="small" style="margin-top:6px">A lens may fit some texts better than others. Note where it fits and where it strains.</div></div>';
 h+='<h3>Guided questions for this text</h3>';
 F.q.concat(L.gen?[L.gen]:[]).forEach(function(q){h+='<div class="q">'+q+'</div>'});
 h+='<div class="row"><button class="btn" onclick="focusText()">Show focus passages in the text</button></div>';
 var k=t.id+":"+S.lens;
 h+='<h3>Your analysis notes</h3><textarea class="lnote" id="lnote" rows="5" placeholder="Write your '+L.n+' reading here. Quote lines as evidence." oninput="S.ln[\''+k+'\']=this.value;save()">'+esc(S.ln[k]||"")+'</textarea><div class="small">Saved on this device. These questions guide your reading; the analysis should be your own.</div>';
 h+='<h3>Quick answers from the text</h3><div class="small">Tap a question. Answers point to specific lines.</div><div class="row">';
 t.qa.forEach(function(x,i){h+='<button class="chip" onclick="askQ('+i+')">'+x.q+'</button>'});h+='</div>';
 if(S.ask!==null){var x=t.qa[S.ask];h+='<div class="ans">'+x.a+' <button class="cite" onclick="showLines('+x.c[0]+',['+x.c.join(",")+'])">[lines '+(x.c[0]+1)+(x.c.length>1?'–'+(x.c[x.c.length-1]+1):'')+']</button></div>'}
 return h;
}
function focusText(){var t=TEXTS[S.cur],ix=stIdx(t,FOCUS[t.id][S.lens].st);showLines(ix[0],ix)}
function showLines(first,arr){S.hl=arr.slice();S.tab="read";render();var e=document.getElementById("l"+first);if(e)e.scrollIntoView({block:"center"})}
function openText(i){S.cur=i;S.tab="read";S.en=false;S.hl=[];S.openNote=-1;S.tip="";S.ask=null;render();window.scrollTo(0,0)}
function gl(k){S.tip="<b>"+k+"</b>: "+TEXTS[S.cur].gloss[k];render()}
function askQ(i){S.ask=i;render()}
function saveNote(i){var v=document.getElementById("nt").value.trim(),k=TEXTS[S.cur].id+":"+i;if(v)S.notes[k]=v;else delete S.notes[k];save();S.openNote=-1;render()}
function toggleTheme(){var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);r.setAttribute("data-theme",dark?"light":"dark")}
render();
</script>
